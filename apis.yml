aid: osaro
name: OSARO
description: OSARO is a San Francisco-based industrial AI company that builds machine-learning software
  for warehouse and fulfillment robotics. Its SightWorks perception platform and AutoModel learning system
  let industrial robot arms perceive, grasp and place highly variable goods without per-SKU pre-training,
  3D object models or fixed programming, powering piece picking, robotic bagging, kitting and mixed-case
  depalletizing in production deployments across five countries. OSARO sells complete robotic work cells
  and licenses its perception software to robot makers and system integrators, wrapping deployments in
  its HyperCare support program. The company publishes no public developer program, API documentation
  or machine-readable API contract; integration with customer estates (WMS/WCS, conveyors, ASRS, AMRs)
  is delivered as a professional-services engagement through OSARO and its integrator partners rather
  than through a self-serve API.
